[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
# Four scoring slots support the staged 60-student classroom audit.
startCommand = "celery -A task_queue.celery_app worker --loglevel=INFO --pool=threads --concurrency=4 --prefetch-multiplier=1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
