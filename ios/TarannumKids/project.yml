name: TarannumKids
options:
  bundleIdPrefix: ai.tarannum
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: L3W5TMTJRJ
    CODE_SIGN_STYLE: Automatic
targets:
  TarannumKids:
    type: application
    platform: iOS
    sources: [Sources/App, Sources/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tarannum.kids
        INFOPLIST_KEY_CFBundleDisplayName: Tarannum Kids
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Configuration/TarannumKids.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Tarannum Kids App Store
    entitlements: {path: Configuration/TarannumKids.entitlements}
    info:
      path: Configuration/TarannumKids-Info.plist
      properties:
        CFBundleDevelopmentRegion: ms
        CFBundleVersion: "14"
        CFBundleShortVersionString: "1.0"
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Tarannum Kids memerlukan mikrofon untuk merekod latihan bacaan.
    dependencies:
      - target: DeviceActivityMonitor
      - target: ShieldConfiguration
      - target: ShieldAction
  DeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources: [Sources/DeviceActivityMonitor, Sources/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tarannum.kids.deviceactivity
        INFOPLIST_FILE: Configuration/DeviceActivityMonitor-Info.plist
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Tarannum Kids Device Activity App Store
    entitlements: {path: Configuration/DeviceActivityMonitor.entitlements}
  ShieldConfiguration:
    type: app-extension
    platform: iOS
    sources: [Sources/ShieldConfiguration, Sources/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tarannum.kids.shieldconfiguration
        INFOPLIST_FILE: Configuration/ShieldConfiguration-Info.plist
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Tarannum Kids Shield Configuration App Store
    entitlements: {path: Configuration/ShieldConfiguration.entitlements}
  ShieldAction:
    type: app-extension
    platform: iOS
    sources: [Sources/ShieldAction, Sources/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tarannum.kids.shieldaction
        INFOPLIST_FILE: Configuration/ShieldAction-Info.plist
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Tarannum Kids Shield Action App Store
    entitlements: {path: Configuration/ShieldAction.entitlements}
