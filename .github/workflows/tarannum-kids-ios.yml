name: Tarannum Kids iOS

on:
  workflow_dispatch:
  push:
    branches:
      - codex/tarannum-kids-foundation
    paths:
      - "ios/TarannumKids/**"
      - ".github/workflows/tarannum-kids-ios.yml"
  pull_request:
    paths:
      - "ios/TarannumKids/**"
      - ".github/workflows/tarannum-kids-ios.yml"

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios/TarannumKids
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPad simulator
        run: >-
          xcodebuild
          -project TarannumKids.xcodeproj
          -scheme TarannumKids
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Upload generated project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TarannumKids-xcode-project
          path: ios/TarannumKids/TarannumKids.xcodeproj
          if-no-files-found: warn

  testflight-upload:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]'))
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/TarannumKids
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install signing materials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_APP: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          PROFILE_ACTIVITY: ${{ secrets.IOS_PROFILE_ACTIVITY_BASE64 }}
          PROFILE_SHIELD_ACTION: ${{ secrets.IOS_PROFILE_SHIELD_ACTION_BASE64 }}
          PROFILE_SHIELD_CONFIGURATION: ${{ secrets.IOS_PROFILE_SHIELD_CONFIGURATION_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/tarannum-kids.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/tarannum-kids-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$PROFILE_APP" | base64 --decode -o "$HOME/Library/MobileDevice/Provisioning Profiles/tarannum-kids.mobileprovision"
          echo -n "$PROFILE_ACTIVITY" | base64 --decode -o "$HOME/Library/MobileDevice/Provisioning Profiles/tarannum-kids-activity.mobileprovision"
          echo -n "$PROFILE_SHIELD_ACTION" | base64 --decode -o "$HOME/Library/MobileDevice/Provisioning Profiles/tarannum-kids-shield-action.mobileprovision"
          echo -n "$PROFILE_SHIELD_CONFIGURATION" | base64 --decode -o "$HOME/Library/MobileDevice/Provisioning Profiles/tarannum-kids-shield-configuration.mobileprovision"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/tarannum-kids.mobileprovision" > "$RUNNER_TEMP/main-profile.plist"
          grep -q '<key>com.apple.developer.family-controls</key>' "$RUNNER_TEMP/main-profile.plist"
          grep -q '<string>group.ai.tarannum.kids</string>' "$RUNNER_TEMP/main-profile.plist"
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive Tarannum Kids
        run: >-
          xcodebuild
          -project TarannumKids.xcodeproj
          -scheme TarannumKids
          -configuration Release
          -destination "generic/platform=iOS"
          -archivePath "$RUNNER_TEMP/TarannumKids.xcarchive"
          archive
      - name: Export IPA
        run: >-
          xcodebuild
          -exportArchive
          -archivePath "$RUNNER_TEMP/TarannumKids.xcarchive"
          -exportPath "$RUNNER_TEMP/TarannumKidsExport"
          -exportOptionsPlist Configuration/ExportOptions.plist
      - name: Verify signed Family Controls entitlements
        run: |
          APP_PATH="$RUNNER_TEMP/TarannumKids.xcarchive/Products/Applications/TarannumKids.app"
          for BUNDLE_PATH in \
            "$APP_PATH" \
            "$APP_PATH/PlugIns/DeviceActivityMonitor.appex" \
            "$APP_PATH/PlugIns/ShieldAction.appex" \
            "$APP_PATH/PlugIns/ShieldConfiguration.appex"
          do
            echo "Verifying $(basename "$BUNDLE_PATH")"
            ENTITLEMENTS_PATH="$RUNNER_TEMP/$(basename "$BUNDLE_PATH").entitlements.plist"
            codesign -d --entitlements :- "$BUNDLE_PATH" > "$ENTITLEMENTS_PATH" 2>/dev/null
            plutil -convert xml1 "$ENTITLEMENTS_PATH"
            plutil -p "$ENTITLEMENTS_PATH"
            grep -q '<key>com.apple.developer.family-controls</key>' "$ENTITLEMENTS_PATH"
            grep -q '<true/>' "$ENTITLEMENTS_PATH"
            grep -q '<key>com.apple.security.application-groups</key>' "$ENTITLEMENTS_PATH"
            grep -q '<string>group.ai.tarannum.kids</string>' "$ENTITLEMENTS_PATH"
          done
      - name: Upload directly to TestFlight
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.private_keys"
          echo -n "$API_KEY_BASE64" | base64 --decode -o "$HOME/.private_keys/AuthKey_$API_KEY_ID.p8"
          IPA_PATH=$(find "$RUNNER_TEMP/TarannumKidsExport" -name '*.ipa' -print -quit)
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/tarannum-kids-signing.keychain-db" || true
