name: Tarannum Kids iOS

on:
  workflow_dispatch:
  push:
    branches:
      - codex/tarannum-kids-foundation
    paths:
      - "ios/TarannumKids/**"
      - ".github/workflows/tarannum-kids-ios.yml"
  pull_request:
    paths:
      - "ios/TarannumKids/**"
      - ".github/workflows/tarannum-kids-ios.yml"

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios/TarannumKids
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPad simulator
        run: >-
          xcodebuild
          -project TarannumKids.xcodeproj
          -scheme TarannumKids
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Upload generated project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TarannumKids-xcode-project
          path: ios/TarannumKids/TarannumKids.xcodeproj
          if-no-files-found: warn
